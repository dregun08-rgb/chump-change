<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chump Change — Split, Save, Level Up</title>
    <meta name="description" content="Split expenses, send Buy-for-Me requests, keep the change, and level up." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0E17" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chump Change" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body style="background:#0B0E17;margin:0">
    <script>window.__bootStart = performance.now();</script>
    <div id="root"></div>
    <!-- Instant splash: monkey icon shows while the app boots (removed by React on mount) -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B0E17;transition:opacity .35s ease;">
      <img src="/logo.png" alt="Chump Change" style="width:110px;height:110px;border-radius:26px;animation:ccbob 1.4s ease-in-out infinite;" />
      <div style="margin-top:18px;color:#fff;font:700 20px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.3px;">Chump Change</div>
      <div style="margin-top:6px;color:rgba(255,255,255,.45);font:500 12px/1 -apple-system,system-ui,sans-serif;">Split · Save · Level Up</div>
      <style>@keyframes ccbob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
